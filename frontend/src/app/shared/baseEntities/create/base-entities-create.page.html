<h1>{{title()}}</h1>

<form [formGroup]="form" class="ui-form" (ngSubmit)="createAsync()">
    <header class="ui-form__header">
        <div><h2>Datos del registro</h2><p>Completa la información para continuar.</p></div>
        <span class="ui-form__tag">Registro</span>
    </header>
    <ui-input label="Nombre" type="text" formControlName="name" [hint]="hint()" [maxLength]="maxLength()" />

    <button type="submit" class="ui-button">Agregar</button>
</form>
