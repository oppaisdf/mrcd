<ui-accordeon title="Filtros">
    <form [formGroup]="form" class="ui-form" (ngSubmit)="sendData()">
        <ui-input label="Fecha" type="date" formControlName="date" />
        <ui-select label="Filtrar por" type="boolean" [items]="filterItems" formControlName="filterOnlyByYear" />
        <button class="ui-button" type="submit">Buscar</button>
    </form>
</ui-accordeon>
<br>
