<form [formGroup]="form" class="ui-form" (ngSubmit)="onSubmit()">
    <header class="ui-form__header">
        <div>
            <h2>Datos del confirmando</h2>
            <p>Información personal y de contacto.</p>
        </div>
        <span class="ui-form__tag">Ficha personal</span>
    </header>
    <ui-input class="ui-field--wide" label="Nombre" type="text" [hint]="hint('name')" formControlName="name"
        [maxLength]="65" />
    <ui-switch label="Género" activeLabel="Masculito" inactiveLabel="Femenino" formControlName="isMasculine" />
    <ui-switch label="Día" activeLabel="Domingo" inactiveLabel="Sábado" formControlName="isSunday" />

    @if (mode() !== 'Inscribir') {
    <ui-switch label="Estado" activeLabel="Activo" inactiveLabel="Inactivo" formControlName="isActive" />
    <ui-input label="Parroquia de bautizo" type="text" [hint]="hint('parish')" formControlName="parish" />
    }
    <ui-input class="ui-field--wide" label="Dirección" type="text" [hint]="hint('address')" formControlName="address"
        [maxLength]="100" />
    <ui-input label="Teléfono" type="text" [hint]="hint('phone')" formControlName="phone" />
    <ui-input label="Fecha de nacimiento" type="date" [hint]="hint('dob')" [min]="dateLimit(false)"
        [max]="dateLimit(true)" formControlName="dob" />
    <ui-select label="Último grado académico" type="string" [items]="degrees()" formControlName="degreeId" />

    <button class="ui-button" type="submit">{{mode()}}</button>
</form>
