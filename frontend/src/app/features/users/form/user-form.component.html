@let _mode = mode();
<form [formGroup]="form" class="ui-form" [class.ui-form--profile]="_mode === 'Actualizarme'" (ngSubmit)="onSubmit()">
    <header class="ui-form__header">
        <div>
            <h2>Datos de acceso</h2>
            <p>Administra el nombre de usuario y la contraseña.</p>
        </div>
        <span class="ui-form__tag">Perfil</span>
    </header>
    <ui-input label="Nombre" type="text" formControlName="username" [hint]="invalidField('username')" />
    <ui-input label="Contraseña" type="password" formControlName="password" [hint]="invalidField('password')" />
    @if (_mode === 'Editar') {
    <ui-switch formControlName="isActive" />
    }

    <button class="ui-button" type="submit">{{ _mode === 'Actualizarme' ? 'Guardar cambios ↗' : _mode }}</button>
</form>

@if (_mode !== 'Actualizarme') {
<h2>Roles</h2>
@if (!hasSelectedRoles) {
<small class="ui-help is-danger">Debe seleccionar un rol</small>
}
<hr>
<div class="ui-table-wrap">
    <table class="ui-table">
        <thead>
            <tr>
                <th>Rol</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            @for (role of roles(); track role.id) {
            <tr>
                <td>{{role.roleName}}</td>
                <td>
                    <button class="ui-button" [class.is-danger]="role.hasRole" (click)="onRoleSubmit(role.id)">
                        @if (role.hasRole) {Eliminar}@else {Agregar}
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
}
