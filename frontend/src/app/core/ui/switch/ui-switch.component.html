<label class="switch" [class.switch--active]="value()" [class.switch--disabled]="disabled()" [attr.for]="id">
    <input class="switch__input" type="checkbox" role="switch" [id]="id"
        [attr.aria-label]="label()" [checked]="value()" [disabled]="disabled()"
        (change)="onToggle($event)" (blur)="onTouched()">
    <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
    <span class="switch__label" aria-hidden="true">{{ value() ? activeLabel() : inactiveLabel() }}</span>
</label>
